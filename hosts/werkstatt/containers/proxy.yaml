services:
  app:
    image: jc21/nginx-proxy-manager:2.16.0
    restart: unless-stopped
    labels:
      host-veth-name.werkstatt-proxy_default: veth_proxy
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /home/jonas/services/proxy/data:/data
      - /home/jonas/services/proxy/letsencrypt:/etc/letsencrypt

networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: br-proxy